[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-marketing-decision-lab"
version = "0.1.0"
description = "Reproducible bank term-deposit targeting research with honest temporal evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jinlei Cao"}]
keywords = ["bank-marketing", "business-analytics", "marketing-science", "machine-learning", "decision-analysis"]
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.4,<1.9",
    "joblib>=1.3,<2",
    "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
app = ["streamlit>=1.35,<2", "plotly>=5.20,<7"]
dev = ["pytest>=8,<10", "ruff>=0.7,<1", "nbformat>=5.9,<6"]

[project.scripts]
banklab = "banklab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
